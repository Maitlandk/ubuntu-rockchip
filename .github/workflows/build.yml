# Build the Turing RK1 Ubuntu 26.04 server image.
#
# Natively on arm64: the U-Boot package from u-boot-build.yml, Canonical's
# root tarball (scripts/build-rootfs.sh), Ubuntu's generic kernel and
# u-boot-menu installed in it (scripts/config-image.sh), then the disk
# image and the two partition images for the eMMC test
# (scripts/build-image.sh). The images are uploaded as an artifact, and
# size, sha256, kernel, partition table and extlinux.conf are reported as
# annotations (see "Reading CI results" in CLAUDE.md). Nothing is flashed.

name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - build.sh
      - scripts/build-rootfs.sh
      - scripts/config-image.sh
      - scripts/build-image.sh
      - config/**
      - overlay/**
      - .github/workflows/build.yml

permissions:
  contents: read

env:
  BOARD: turing-rk1
  SUITE: resolute
  FLAVOR: server

jobs:
  u-boot:
    uses: ./.github/workflows/u-boot-build.yml

  image:
    needs: u-boot
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: u-boot-turing-rk1
          path: build

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            parted dosfstools uuid-runtime xz-utils udev gdisk curl gpgv ubuntu-cloudimage-keyring

      - name: Build
        run: sudo ./build.sh --board="$BOARD" --suite="$SUITE" --flavor="$FLAVOR"

      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-26.04-${{ env.FLAVOR }}-${{ env.BOARD }}
          path: images/*
          compression-level: 0
          if-no-files-found: error

      # Look inside what was built. The annotations are the report; the
      # check-runs API serves them without a GitHub sign-in and job logs it
      # does not.
      - name: Report
        run: |
          set -eu
          cd images
          sudo mkdir -p /mnt/chk/root /mnt/chk/esp
          disk=$(ls ./*.img.xz | grep -v -e '\.esp\.' -e '\.root\.'); esp=$(ls ./*.esp.img.xz); root=$(ls ./*.root.img.xz)
          : > ../report; : > ../errors; : > ../warnings
          {
            for f in "$disk" "$esp" "$root"; do
              echo "$(basename "$f"): $(stat -c %s "$f") bytes xz, sha256 $(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
          } >> ../report

          # Partition table and boot loader, from the disk image. U-Boot's
          # distro boot searches the ESP-typed partition 1 for
          # EFI/BOOT/BOOTAA64.EFI; the root is an ordinary Linux filesystem.
          xz -dc "$disk" | dd of=/tmp/disk.img bs=1M conv=sparse status=none
          {
            echo "partition table:"
            sgdisk -p /tmp/disk.img 2>&1 | sed -n '/^Number/,$p'
            for n in 1 2; do
              sgdisk -i "$n" /tmp/disk.img 2>&1 | grep -E 'Partition GUID code|Attribute flags'
            done
            echo "boot loader (sector 64): $(dd if=/tmp/disk.img bs=512 skip=64 count=8192 2>/dev/null | strings -n 8 | grep -m1 'U-Boot SPL' || echo none)"
          } >> ../report
          sgdisk -i 1 /tmp/disk.img 2>&1 | grep -q 'C12A7328-F81F-11D2-BA4B-00A0C93EC93B' ||
            echo "partition 1 is not an EFI System Partition" >> ../errors
          sgdisk -i 2 /tmp/disk.img 2>&1 | grep -q '0FC63DAF-8483-4772-8E79-3D69D8477DE4' ||
            echo "partition 2 is not Linux filesystem data" >> ../errors
          grep -q 'U-Boot SPL 2026' ../report || echo "no U-Boot 2026 SPL at sector 64" >> ../errors

          # The ESP image: GRUB for removable media, and the cloud-init seed.
          xz -dc "$esp" > /tmp/esp.img
          sudo mount -o loop,ro /tmp/esp.img /mnt/chk/esp
          {
            echo
            echo "esp: $(sudo blkid -o export /tmp/esp.img | grep -E '^(TYPE|LABEL|UUID)=' | paste -sd' ')"
            echo "esp files:"; (cd /mnt/chk/esp && find . -type f -printf '%p %s\n' | sort)
          } >> ../report
          for f in user-data meta-data network-config EFI/BOOT/BOOTAA64.EFI; do
            [ -f "/mnt/chk/esp/$f" ] || echo "no $f on the ESP" >> ../errors
          done
          sudo umount /mnt/chk/esp

          # The root filesystem image, read-only.
          xz -dc "$root" > /tmp/root.img
          sudo mount -o loop,ro /tmp/root.img /mnt/chk/root
          uuid=$(sudo blkid -s UUID -o value /tmp/root.img)
          cfg=/mnt/chk/root/boot/grub/grub.cfg
          kvers=$(ls /mnt/chk/root/boot/vmlinuz-* | sed 's,.*/vmlinuz-,,')
          {
            echo
            echo "kernel: $(echo $kvers)"
            echo "root filesystem: $(sudo blkid -o value -s TYPE /tmp/root.img) UUID $uuid, $(df -h --output=size,used /mnt/chk/root | tail -n1 | tr -s ' ')"
            echo "fstab: $(grep -v '^#' /mnt/chk/root/etc/fstab | tr -s ' ' | paste -sd';')"
            echo "grub.cfg linux/initrd/devicetree lines:"
            sudo grep -E '^\s+(linux|initrd|devicetree)\s' "$cfg" | sort -u
          } >> ../report
          grep -q "UUID=$uuid /" /mnt/chk/root/etc/fstab || echo "fstab has no root UUID=$uuid" >> ../errors
          grep -q ' /boot/efi ' /mnt/chk/root/etc/fstab || echo "fstab has no /boot/efi" >> ../errors
          sudo grep -q "root=UUID=$uuid" "$cfg" || echo "grub.cfg does not point at root=UUID=$uuid" >> ../errors
          ! sudo grep -q 'GRUB_FORCE_PARTUUID\|PARTUUID=' "$cfg" || echo "grub.cfg uses a PARTUUID" >> ../errors
          ! sudo grep -oE 'console=[^ ]*' "$cfg" | grep -v '^console=ttyS9' | grep -q . || echo "grub.cfg has a console= other than ttyS9" >> ../errors
          for k in $kvers; do
            for f in "boot/vmlinuz-$k" "boot/initrd.img-$k" "boot/dtb-$k"; do
              [ -e "/mnt/chk/root/$f" ] || echo "no /$f in the root image" >> ../errors
            done
            sudo cmp -s "/mnt/chk/root/boot/dtb-$k" "/mnt/chk/root/lib/firmware/$k/device-tree/rockchip/rk3588-turing-rk1.dtb" ||
              echo "/boot/dtb-$k is not the kernel's rk3588-turing-rk1.dtb" >> ../errors
            sudo grep -q "^\s*devicetree\s*/boot/dtb-$k\$" "$cfg" || echo "grub.cfg does not load /boot/dtb-$k" >> ../errors
          done
          sudo umount /mnt/chk/root

          # The same root image with a second kernel installed in a chroot, as
          # an apt upgrade on the board would: grub.cfg must then load that
          # kernel's DTB too, and drop it again when the kernel is removed.
          sudo mkdir -p /mnt/chk/rw
          sudo mount -o loop /tmp/root.img /mnt/chk/rw
          sudo mount -o loop /tmp/esp.img /mnt/chk/rw/boot/efi
          sudo mount --bind /dev /mnt/chk/rw/dev
          sudo mount -t proc proc /mnt/chk/rw/proc
          sudo mount -t sysfs sysfs /mnt/chk/rw/sys
          sudo cp /etc/resolv.conf /mnt/chk/rw/etc/resolv.conf
          rw() { sudo chroot /mnt/chk/rw "$@"; }
          sudo mount -t tmpfs none /mnt/chk/rw/var/lib/apt/lists
          rw apt-get -qq update
          kver=$(echo $kvers | cut -d' ' -f1)
          other=$(rw apt-cache search --names-only '^linux-image-[0-9.]+-[0-9]+-generic$' |
                    sed 's/^linux-image-\(.*\)-generic .*/\1/' | grep -vxF "${kver%-generic}" | sort -V | head -n1)
          if [ -z "$other" ]; then
            echo "no second linux-image-*-generic in the archive to install" >> ../errors
          elif ! rw env DEBIAN_FRONTEND=noninteractive apt-get -y -qq install --no-install-recommends "linux-image-$other-generic"; then
            echo "installing linux-image-$other-generic in the image failed" >> ../errors
          else
            for k in $kvers "$other-generic"; do
              sudo grep -q "^\s*devicetree\s*/boot/dtb-$k\$" /mnt/chk/rw/boot/grub/grub.cfg ||
                echo "after installing $other-generic, grub.cfg does not load /boot/dtb-$k" >> ../errors
            done
            echo "after installing linux-image-$other-generic, grub.cfg:" >> ../report
            sudo grep -E '^\s+(linux|initrd|devicetree)\s' /mnt/chk/rw/boot/grub/grub.cfg | sort -u >> ../report
            rw env DEBIAN_FRONTEND=noninteractive apt-get -y -qq purge "linux-image-$other-generic" "linux-modules-$other-generic" ||
              echo "removing linux-image-$other-generic failed" >> ../errors
            ! sudo grep -q "dtb-$other-generic" /mnt/chk/rw/boot/grub/grub.cfg ||
              echo "after removing $other-generic, grub.cfg still mentions its DTB" >> ../errors
          fi
          echo "ESP after the kernel changes: $(cd /mnt/chk/rw/boot/efi && find . -type f | sort | paste -sd' ')" >> ../report
          sudo umount /mnt/chk/rw/var/lib/apt/lists /mnt/chk/rw/sys /mnt/chk/rw/proc /mnt/chk/rw/dev /mnt/chk/rw/boot/efi /mnt/chk/rw

          cd ..
          cat report
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error title=image::$line"
          done < errors
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' report)
          echo "::notice title=image ($BOARD $SUITE $FLAVOR)::$msg"
          test ! -s errors
