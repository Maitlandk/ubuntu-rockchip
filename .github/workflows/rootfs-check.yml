# Is the root filesystem stock Ubuntu?
#
# Runs scripts/build-rootfs.sh (Canonical's signed arm64 cloud root
# tarball), then installs the generic kernel in it as
# scripts/config-image.sh does, inside a container on a native arm64
# runner, and reports what is installed and where it came from. No image
# is built here; D1 does that.

name: Rootfs check

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-rootfs.sh
      - scripts/config-image.sh
      - config/suites/**
      - config/boards/turing-rk1.sh
      - .github/workflows/rootfs-check.yml

permissions:
  contents: read

env:
  SUITE: resolute
  FLAVOR: server

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck -f gcc scripts/build-rootfs.sh |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'
          exit "${PIPESTATUS[0]}"

  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify the root filesystem
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install ubuntu-cloudimage-keyring
          scripts/build-rootfs.sh
          ls -l build

      # Results go out as annotations as well as the log, because the
      # check-runs API serves annotations without a GitHub sign-in and
      # job logs it does not. See "Reading CI results" in CLAUDE.md.
      - name: Install the kernel and report
        run: |
          . "config/suites/$SUITE.sh"
          xz -dc "build/ubuntu-$RELASE_VERSION-preinstalled-$FLAVOR-arm64.rootfs.tar.xz" |
            docker import - rootfs
          cat > check.sh << 'EOF'
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          # flash-kernel exits in a container or chroot unless told otherwise.
          export FK_FORCE=yes
          r=/w/report; e=/w/errors; : > "$r"; : > "$e"
          echo "serial: $(cat /etc/cloud/build.info 2>/dev/null | tr '\n' ' ')" >> "$r"
          for p in ubuntu-server cloud-init dracut; do
            echo "$p: $(dpkg-query -W -f '${Version}' "$p" 2>/dev/null || echo MISSING)" >> "$r"
          done
          pre=$(dpkg-query -W -f '${Package}\n' 'linux-image-*' 'grub-*' 'flash-kernel' 2>/dev/null || true)
          [ -z "$pre" ] || echo "kernel or boot loader already in the tarball: $pre" >> "$e"
          # As scripts/config-image.sh does it.
          apt-get -qq update
          apt-get -y -qq upgrade
          . /w/config/boards/turing-rk1.sh
          config_image_hook__turing-rk1 /
          echo "grub-efi-arm64 grub2/update_nvram boolean false" | debconf-set-selections
          if ! apt-get -y install --no-install-recommends linux-generic; then
            echo "apt-get install linux-generic failed, see the job log" >> "$e"
            exit 0
          fi
          # After the kernel: flash-kernel's postinst fails silently with FK_FORCE=yes when no kernel is installed.
          # The tail of apt's output goes into the error, as job logs are not readable without a sign-in.
          if ! apt-get -y -o Dpkg::Options::=--force-confold install --no-install-recommends flash-kernel grub-efi-arm64 > /w/apt.log 2>&1; then
            echo "installing flash-kernel and grub-efi-arm64 failed: $(tail -n 25 /w/apt.log | tr '\n' '|')" >> "$e"
            exit 0
          fi
          for p in flash-kernel grub-efi-arm64 grub2-common; do
            echo "$p: $(dpkg-query -W -f '${Version}' "$p")" >> "$r"
          done
          kver=$(dpkg-query -W -f '${Depends}' linux-image-generic | sed -n 's/^linux-image-\([^ ,]*\).*/\1/p')
          echo "kernel: $kver" >> "$r"
          dtb=/usr/lib/firmware/$kver/device-tree/rockchip/rk3588-turing-rk1.dtb
          if [ -f "$dtb" ]; then echo "dtb: $dtb" >> "$r"; else echo "no $dtb" >> "$e"; fi
          if [ -f "/boot/initrd.img-$kver" ]; then echo "initrd: /boot/initrd.img-$kver" >> "$r"
          else echo "no /boot/initrd.img-$kver" >> "$e"; fi
          u=$(command -v update-initramfs || true)
          echo "update-initramfs: ${u:-none}${u:+ ($(dpkg -S "$u" 2>/dev/null | cut -d: -f1))}" >> "$r"
          echo "apt sources: $(grep -rhoE '^(URIs: |deb )[^ ]+( [^ ]+)?' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sort -u | tr '\n' ' ')" >> "$r"
          echo "packages: $(dpkg-query -W | wc -l)" >> "$r"
          # [installed,local]: no configured archive offers that version.
          local_pkgs=$(apt list --installed 2>/dev/null | grep ',local\]' || true)
          [ -z "$local_pkgs" ] || echo "packages not from the archive: $local_pkgs" >> "$e"
          # B2: flash-kernel puts each kernel's DTB at /boot/dtb-<kver>, the
          # name GRUB's 10_linux turns into a devicetree line. Check it
          # for the kernel installed above, for a second one (the oldest
          # other ABI in the archive stands in for "the next kernel
          # update") and after the second one is removed again.
          check_dtbs() {
            for v in $(linux-version list); do
              l=/boot/dtb-$v
              if [ ! -e "$l" ]; then echo "$1: $l is missing or dangling" >> "$e"
              elif ! cmp -s "$l" "/lib/firmware/$v/device-tree/rockchip/rk3588-turing-rk1.dtb"; then
                echo "$1: $l is not the kernel's rk3588-turing-rk1.dtb" >> "$e"
              fi
            done
            echo "$1: $(for v in $(linux-version list); do printf '%s -> %s; ' "/boot/dtb-$v" "$(readlink "/boot/dtb-$v")"; done)" >> "$r"
          }
          check_dtbs "first kernel"
          other=$(apt-cache search --names-only '^linux-image-[0-9.]+-[0-9]+-generic$' |
                    sed 's/^linux-image-\(.*\)-generic .*/\1/' | grep -vxF "${kver%-generic}" |
                    sort -V | head -n1)
          if [ -z "$other" ]; then
            echo "no second linux-image-*-generic in the archive to install" >> "$e"
          elif ! apt-get -y -qq install --no-install-recommends "linux-image-$other-generic"; then
            echo "apt-get install linux-image-$other-generic failed, see the job log" >> "$e"
          else
            [ "$(linux-version list | wc -l)" -ge 2 ] || echo "fewer than two kernels installed" >> "$e"
            check_dtbs "second kernel"
            apt-get -y -qq purge "linux-image-$other-generic" "linux-modules-$other-generic" ||
              echo "removing linux-image-$other-generic failed" >> "$e"
            [ ! -e "/boot/dtb-$other-generic" ] && [ ! -e "/boot/dtb-$other" ] ||
              echo "/boot/dtb-$other is still there after the kernel was removed" >> "$e"
            check_dtbs "after removing the second kernel"
          fi
          echo "kernels now: $(linux-version list | tr '\n' ' ')" >> "$r"
          # U-Boot's extlinux support (booti) wants an arm64 Image, and an EFI zboot
          # vmlinuz (CONFIG_EFI_ZBOOT) is a compressed PE image that only an EFI
          # loader can run: that is why the image boots through GRUB. Report which
          # one Ubuntu ships, from the config and from the file itself.
          echo "kernel config: $(grep -E '^(# )?CONFIG_(EFI_ZBOOT|EFI_STUB|KERNEL_(GZIP|ZSTD|UNCOMPRESSED))[= ]' "/boot/config-$kver" | tr '\n' ' ')" >> "$r"
          # The command line grub-mkconfig will use: the cloud image's
          # /etc/default/grub.d files and ours, sourced in order as
          # grub-mkconfig does. The serial console must follow the DT's
          # stdout-path (serial9, ttyS9 on the RK1): the 8250 driver
          # honours line 9 below RUNTIME_UARTS, and any console= other
          # than ttyS9 (the cloud image sets tty1 and ttyAMA0) would
          # silence the line and switch the stdout-path fallback off.
          echo "serial config: $(grep -E '^CONFIG_SERIAL_8250_(NR_UARTS|RUNTIME_UARTS|CONSOLE|DW)=|^CONFIG_SERIAL_EARLYCON=' "/boot/config-$kver" | tr '\n' ' ')" >> "$r"
          eff=$(. /etc/default/grub; for f in /etc/default/grub.d/*.cfg; do . "$f"; done
                echo "cmdline=[$GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT] force_partuuid=[$GRUB_FORCE_PARTUUID]")
          echo "grub command line: $eff" >> "$r"
          echo "/etc/default/grub.d: $(ls /etc/default/grub.d | tr '\n' ' ')" >> "$r"
          echo "$eff" | grep -oE 'console=[^ ]*' | grep -v '^console=ttyS9' > bad || true
          [ ! -s bad ] || echo "console= other than ttyS9 on the grub command line: $(cat bad)" >> "$e"
          echo "$eff" | grep -q 'force_partuuid=\[\]' || echo "GRUB_FORCE_PARTUUID is set: $eff" >> "$e"
          echo "vmlinuz-$kver: $(stat -c %s "/boot/vmlinuz-$kver") bytes, first bytes $(od -A n -t x1 -N 4 "/boot/vmlinuz-$kver"), offset 56 $(od -A n -t x1 -j 56 -N 4 "/boot/vmlinuz-$kver")" >> "$r"
          EOF
          status=0
          docker run --rm -v "$PWD:/w" rootfs bash /w/check.sh || status=1
          report=$(cat report)
          echo "$report"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error title=rootfs::$line"
            status=1
          done < errors
          report=${report//%/%25}
          echo "::notice title=rootfs ($SUITE $FLAVOR)::${report//$'\n'/%0A}"
          exit $status
