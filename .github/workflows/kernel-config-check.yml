# Does Ubuntu's own arm64 kernel support our boards?
#
# Downloads linux-image-generic for an Ubuntu release from the archive,
# checks its .config against config/kernel-check/<profile>.txt and checks
# that the board device trees ship with it. No kernel is built here: the
# whole point is to use Canonical's.

name: Kernel config check

on:
  workflow_dispatch:
    inputs:
      release:
        description: Ubuntu release (docker tag)
        default: "26.04"
      profiles:
        description: Profiles in config/kernel-check/, space separated
        default: "rk3588 turing-rk1"
      dtbs:
        description: Device trees that must ship with the kernel, space separated
        default: "rockchip/rk3588-turing-rk1.dtb"
  push:
    paths:
      - config/kernel-check/**
      - scripts/check-kernel-config.sh
      - .github/workflows/kernel-config-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE: ${{ inputs.release || '26.04' }}
      PROFILES: ${{ inputs.profiles || 'rk3588 turing-rk1' }}
      DTBS: ${{ inputs.dtbs || 'rockchip/rk3588-turing-rk1.dtb' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the generic kernel packages
        run: |
          mkdir -p pkgs
          docker run --rm -v "$PWD/pkgs:/out" "ubuntu:$RELEASE" bash -euc '
            apt-get -qq update
            img=$(apt-cache depends linux-image-generic |
                  sed -n "s/.*Depends: \(linux-image-[0-9].*-generic\)$/\1/p" | head -n1)
            kver=${img#linux-image-}
            test -n "$kver"
            cd /out
            apt-get -qq download "linux-image-$kver" "linux-modules-$kver"
            apt-get -qq download "linux-modules-extra-$kver" || true
            echo "$kver" > kver
            # Whether a stock install pulls in modules-extra decides whether
            # an =m driver that lives there is actually on the system.
            apt-cache depends linux-image-generic > depends
          '
          ls -l pkgs

      - name: Unpack
        run: |
          for deb in pkgs/*.deb; do dpkg-deb -x "$deb" root; done
          kver=$(cat pkgs/kver)
          echo "KVER=$kver" >> "$GITHUB_ENV"
          echo "### Ubuntu $RELEASE, kernel \`$kver\`" >> "$GITHUB_STEP_SUMMARY"

      # Results go out as annotations as well as the log, because the
      # check-runs API serves annotations without a GitHub sign-in and
      # job logs it does not. See "Reading CI results" in CLAUDE.md.
      - name: Check device trees
        run: |
          missing=0
          report="Ubuntu $RELEASE, kernel $KVER"$'\n'"$(cat pkgs/depends)"$'\n'
          for dtb in $DTBS; do
            found=$(find root -path "*/$dtb" | head -n1)
            if [ -n "$found" ]; then
              pkg=$(for d in pkgs/*.deb; do
                      dpkg-deb -c "$d" | grep -q "/$dtb\$" && basename "$d"; done | head -n1)
              line="ok      $dtb  ${found#root/}  ($pkg)"
              echo "- DTB \`$dtb\`: shipped (\`${found#root/}\`, $pkg)" >> "$GITHUB_STEP_SUMMARY"
            else
              line="MISSING $dtb"
              echo "::error title=DTB missing::$dtb is not in the $KVER packages"
              echo "- DTB \`$dtb\`: **missing**" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
            echo "$line"
            report+="$line"$'\n'
          done
          report=${report//%/%25}
          echo "::notice title=kernel packages and device trees::${report//$'\n'/%0A}"
          exit $missing

      - name: Check kernel config
        if: always()
        run: |
          config=$(find root/boot -name "config-$KVER")
          test -n "$config"
          set --
          for p in $PROFILES; do set -- "$@" "config/kernel-check/$p.txt"; done
          bash scripts/check-kernel-config.sh "$config" "$@"

      - name: Keep the config
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-${{ env.KVER }}
          path: root/boot/config-*
